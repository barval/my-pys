<div class="card narrow">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('password_change') }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Текущий пароль
      <input type="password" name="current" required autocomplete="current-password">
    </label>
    <label>Новый пароль
      <input type="password" name="new" required minlength="8" autocomplete="new-password">
    </label>
    <label>Повторите новый пароль
      <input type="password" name="confirm" required minlength="8" autocomplete="new-password">
    </label>
    <button class="btn btn-success" type="submit">Сохранить</button>
  </form>
  <p class="muted">После смены пароля текущая сессия завершится и потребуется войти заново.</p>
</div>
