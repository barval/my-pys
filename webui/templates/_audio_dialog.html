<dialog class="say-dialog" id="audio-dialog-{{ profile.name }}">
  <form method="post" action="/speakers/{{ profile.name }}/audio" enctype="multipart/form-data" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h3>Аудиофайл для проверки</h3>
    <label>Файл
      <input type="file" name="file" required
             accept="audio/*,.wav,.mp3,.ogg,.oga,.opus,.m4a,.aac,.flac">
    </label>
    <p class="muted small">WAV стримится в aplay, остальное конвертируется
      через ffmpeg на хосте. До 20 МБ.</p>
    <div class="form-actions">
      <button class="btn btn-success" type="submit">Проиграть</button>
      <button class="btn" type="button" data-dialog-close>Отмена</button>
    </div>
  </form>
</dialog>
