<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#3498db">
  <title>{% block title %}{{ config.WEBUI_TITLE }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css', v=config.WEBUI_ASSET_VERSION) }}">
  {% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark">◉</span>
    <span>{{ config.WEBUI_TITLE }}</span>
  </a>
  <nav class="nav">
    <a class="{% if request.path == '/' %}active{% endif %}" href="/">Колонки</a>
    <a class="{% if request.path.startswith('/access') %}active{% endif %}" href="/access">Модели</a>
    <a class="{% if request.path.startswith('/test') %}active{% endif %}" href="/test">Проверка</a>
    <a class="{% if request.path.startswith('/more') %}active{% endif %}" href="/more">Ещё</a>
    <a class="{% if request.path.startswith('/advanced') %}active{% endif %}" href="/advanced">Дополнительно</a>
  </nav>
  <div class="header-actions">
    <form method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="btn btn-sm" type="submit">Выйти</button>
    </form>
  </div>
</header>

<div class="page">
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
      <div class="flashes">
        {% for message in messages %}<p class="flash">{{ message }}</p>{% endfor %}
      </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</div>

<script src="{{ url_for('static', filename='app.js', v=config.WEBUI_ASSET_VERSION) }}"></script>
</body>
</html>
