services:
  lite-kit:
    build:
      context: ${LITE_KIT_CONTEXT:-..}
      dockerfile: docker/lite-kit.Dockerfile
    container_name: ysl-lite-kit
    network_mode: host
    restart: unless-stopped
    volumes:
      - ${HOST_REPO_PATH:-..}/vendor/lite-kit/firmware:/app/firmware:ro
      - ${HOST_REPO_PATH:-..}/vendor/lite-kit/run:/app/run
      - ${HOST_REPO_PATH:-..}/vendor/lite-kit/log:/app/log
