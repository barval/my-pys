services:
  flai-proxy:
    build:
      context: ..
      dockerfile: docker/flai-proxy.Dockerfile
    container_name: flai-invocation-proxy
    network_mode: host
    restart: unless-stopped
    environment:
      LLM_UPSTREAM: http://127.0.0.1:5000
      FLAI_UPSTREAM: http://127.0.0.1:5000
      PROXY_PORT: "5001"
      PROXY_TIMEOUT: "600"
